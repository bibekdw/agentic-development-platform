name: toolkit-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Node is needed so the tests can execute the pinned OpenSpec CLI (configs/openspec.json).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_manifest.py examples/change-manifest.json
